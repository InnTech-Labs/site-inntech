# Configuração da Netlify.
# A branch main é o site no ar; cada PR gera uma prévia (deploy preview).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Prévias não são indexadas: a Netlify define CONTEXT=deploy-preview e o
# layout (src/layouts/Base.astro) e o robots.txt usam isso para pedir noindex.

# Cabeçalhos de segurança e cache.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O endereço técnico da Netlify leva para o domínio oficial: evita o site em dobro no Google.
# As prévias (deploy-preview-N--inntechlabs.netlify.app) têm outro endereço e não são afetadas.
[[redirects]]
  from = "https://inntechlabs.netlify.app/*"
  to = "https://inntechlabs.com.br/:splat"
  status = 301
  force = true

# Redirects 301 de URLs antigas (quando o site substituir outro):
# [[redirects]]
#   from = "/pagina-antiga"
#   to = "/pagina-nova"
#   status = 301
