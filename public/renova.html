<style>
/* Layout: sidebar de navegação + área de trabalho; no celular a navegação vira faixa rolável no topo. O tour guiado fica num cartão fixo (folha inferior no celular). */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --sunk:#E3E9ED; --ink:#13222B; --muted:#5A6C78; --line:#D3DCE2;
  --accent:#0B5C78; --accent-ink:#FFFFFF; --accent-soft:#D9EAF1;
  --ok:#1B7349; --ok-soft:#DCF0E4; --warn:#995A00; --warn-soft:#FAE9CC; --crit:#B3261E; --crit-soft:#F8DCD9;
  --bubble:#DCF3E3; --shadow:rgba(8,16,22,.22);
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#141E24; --sunk:#1A262E; --ink:#E4ECF1; --muted:#93A5B2; --line:#26343D;
  --accent:#62B6D3; --accent-ink:#06222D; --accent-soft:#163542;
  --ok:#5CC48F; --ok-soft:#14301F; --warn:#E9AA3C; --warn-soft:#382912; --crit:#F2786C; --crit-soft:#3B1B18;
  --bubble:#173A27; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E24; --sunk:#1A262E; --ink:#E4ECF1; --muted:#93A5B2; --line:#26343D;
  --accent:#62B6D3; --accent-ink:#06222D; --accent-soft:#163542;
  --ok:#5CC48F; --ok-soft:#14301F; --warn:#E9AA3C; --warn-soft:#382912; --crit:#F2786C; --crit-soft:#3B1B18;
  --bubble:#173A27; --shadow:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:750}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.98rem;font-weight:650}
.mono{font-family:var(--mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding-inline:8px}
.brand b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.45rem;letter-spacing:-.02em;color:var(--accent)}
.brand span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
nav.menu a:hover{background:var(--sunk)}
nav.menu a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font-size:.72rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding-inline:8px;border-top:1px solid var(--line);padding-top:14px}

main{min-width:0;padding-block:22px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.company{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-stretch:125%}
.company small{display:block;color:var(--muted);font-size:.78rem}
.tb-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.demo{font-size:.76rem;border:1px dashed var(--muted);color:var(--muted);border-radius:20px;padding:3px 10px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 12px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-stretch:100%;font-weight:750;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:.8rem;color:var(--muted)}
.kpi.crit .val{color:var(--crit)} .kpi.warn .val{color:var(--warn)} .kpi.ok .val{color:var(--ok)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .body{padding:6px 16px 14px}

.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .s{font-size:.82rem;color:var(--muted)}
.kind{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.kind svg{width:16px;height:16px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.none{background:var(--sunk);color:var(--muted)}
.pill.plain::before{display:none}

.loja{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.loja:last-child{border-bottom:0}
.loja .top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-crit{background:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);padding-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:.84rem;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .s{display:block;font-size:.8rem;color:var(--muted)}
.d-crit{color:var(--crit);font-weight:600} .d-warn{color:var(--warn);font-weight:600}

.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.flow div{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.flow div:last-child{border-right:0}
.flow b{font-family:var(--mono);font-size:.74rem;color:var(--accent);font-weight:500}
.flow strong{font-size:.92rem}
.flow span{font-size:.8rem;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--ink);border-color:var(--accent)}

.aclist{display:flex;flex-direction:column;gap:12px}
.ac{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ac.fresh{border-color:var(--accent)}
.ac .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ac .meta{font-size:.84rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:3px}
.ac .money{text-align:right}
.ac .money b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.ac .money small{display:block;color:var(--muted);font-size:.78rem}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:0}
.steps li{position:relative;padding-top:18px;font-size:.76rem;color:var(--muted);min-width:0}
.steps li::before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:var(--line)}
.steps li::after{content:"";position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.steps li.done::before{background:var(--accent)}
.steps li.done::after{background:var(--accent);border-color:var(--accent)}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li.cur::after{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.itens{display:flex;flex-wrap:wrap;gap:6px}
.itens span{font-size:.8rem;background:var(--sunk);border-radius:6px;padding:3px 8px}
.ac .foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
details.log summary{cursor:pointer;color:var(--muted);font-size:.84rem}
details.log ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
details.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
details.log time{color:var(--muted);font-variant-numeric:tabular-nums}

.forn{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.84rem}
.fcard dt{color:var(--muted)}
.fcard dd{margin:0}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.82rem;font-weight:600}
.field .help{font-size:.78rem;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,16,22,.55);display:grid;place-items:center;z-index:50;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;width:min(560px,100%);max-height:100%;overflow:auto;border:1px solid var(--line)}
.dlg>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.dlg>header p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
.dlg .x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.dlg .content{padding:0 20px 18px;display:flex;flex-direction:column;gap:14px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--sunk)}
.chat{background:var(--sunk);border-radius:10px;padding:14px}
.chat .to{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.bubble{background:var(--bubble);border-radius:10px 10px 10px 2px;padding:10px 12px;white-space:pre-wrap;font-size:.88rem;max-width:44ch}
.phone{width:min(300px,100%);margin:0 auto;border:8px solid var(--ink);border-radius:26px;background:var(--bg);overflow:hidden}
.phone .bar0{background:var(--ink);color:var(--bg);font-size:.72rem;padding:4px 14px 8px;display:flex;justify-content:space-between}
.phone .ph{padding:14px;display:flex;flex-direction:column;gap:10px}
.phone .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.82rem}
.phone .field input{background:var(--surface)}
.caption{font-size:.8rem;color:var(--muted);text-align:center}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:.9rem;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;font-weight:500}
.doc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.doc .ic{width:34px;height:42px;border-radius:4px;background:var(--crit-soft);color:var(--crit);display:grid;place-items:center;font-size:.66rem;font-weight:700;font-family:var(--mono)}
.ia{border:1px solid var(--accent);border-radius:8px;padding:12px 14px;background:var(--accent-soft)}
.ia h3{color:var(--accent);font-size:.86rem;font-family:var(--body);font-stretch:100%;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.ia ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.ia li b{display:block}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:r .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px var(--shadow)}
body.touring .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Boas-vindas */
.welcome .w-body{padding:26px 24px 20px;display:flex;flex-direction:column;gap:12px}
.w-eye{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.welcome h2{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:2.4rem;line-height:1;color:var(--accent);letter-spacing:-.02em}
.w-lead{margin:0;font-size:1.02rem;max-width:46ch}
.w-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem;color:var(--muted)}
.w-list li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px}
.w-list li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}

/* Tour guiado */
.tour-hl{position:relative;z-index:3;outline:3px solid var(--accent);outline-offset:4px;animation:tourpulse 1.8s ease-in-out infinite}
@keyframes tourpulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 12px var(--accent-soft)}}
.tourcard{position:fixed;z-index:40;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(370px,calc(100vw - 40px));background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:12px;padding:16px;box-shadow:0 14px 40px var(--shadow);display:flex;flex-direction:column;gap:10px}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-step{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.tourcard .x{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.tc-bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.tc-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tourcard h3{font-size:1.02rem;margin-bottom:4px}
.tourcard p{margin:0;font-size:.9rem;line-height:1.5}
.tc-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.tc-wait{font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tc-wait::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
body.modal-open .tourcard{display:none}
body.touring main{padding-bottom:240px}
.tourhint{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:.86rem}
.tourhint b{color:var(--accent)}
.nw{white-space:nowrap}

@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .flow{grid-template-columns:minmax(0,1fr)} .flow div{border-right:0;border-bottom:1px solid var(--line)} .flow div:last-child{border-bottom:0}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:14px 0;padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .side-foot{display:none}
  nav.menu{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.45rem}
}
@media (max-width:640px){
  .tourcard{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;border-bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.touring main{padding-bottom:300px}
}
@media (max-width:480px){.steps li{font-size:0;padding-top:14px} .steps li.cur{font-size:.72rem;white-space:nowrap} .ac .money{text-align:left}}
@media (prefers-reduced-motion:reduce){.spin,.tour-hl,.tc-wait::before{animation:none} .tc-bar i{transition:none}}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>Renova</b><span>por InnTech</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot">Protótipo de demonstração. Empresa, pessoas e fornecedores são fictícios.</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="company"><div class="logo">R</div><div><strong>Rodafort Pneus</strong><small>5 lojas · 32 itens controlados</small></div></div>
      <div class="tb-r"><span class="demo">Ambiente de demonstração · dados fictícios</span><button class="btn sm" data-act="tourStart">Tour guiado</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div>
<div id="tour"></div>
<div id="toastbox"></div>

<script>
const DAY=864e5;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const ad=n=>new Date(T0.getTime()+n*DAY);
const diff=d=>Math.round((d-T0)/DAY);
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x};
const fd=d=>d.toLocaleDateString('pt-BR');
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const [y,m,x]=s.split('-').map(Number);return new Date(y,m-1,x)};
const first=n=>n.split(' ')[0];
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\W+/g,'');
const q=s=>document.querySelector(s);
const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const LOJAS=['Macaé – Centro','Macaé – Cavaleiros','Campos','Rio das Ostras','Cabo Frio'];
const CURSOS={
 'Brigada de incêndio':{m:12,p:190,ch:'8 h'},
 'NR-35 Trabalho em altura':{m:24,p:280,ch:'8 h'},
 'NR-10 Básico':{m:24,p:420,ch:'40 h'},
 'NR-11 Empilhadeira':{m:12,p:350,ch:'16 h'},
 'NR-12 Elevador automotivo':{m:24,p:240,ch:'8 h'},
 'Direção defensiva':{m:24,p:160,ch:'8 h'}
};
const REC='Recarga (nível 2)', HID='Teste hidrostático (nível 3)';
const PER_EXT={[REC]:12,[HID]:60};
const PRECO_EXT={'PQS 6 kg':{r:78,h:95},'CO₂ 6 kg':{r:115,h:140},'AP 10 L':{r:62,h:80}};

let S;
function seed(){
 const s={
  janela:30, limite:300, canal:'WhatsApp e e-mail', aprovador:'Ana Paula Ribeiro', fl:'todas', fs:'todos', tab:'abertos', seq:1048, fresh:new Set(),
  trn:[
   ['T1','Carlos Menezes','Montador','Macaé – Centro','NR-35 Trabalho em altura',210],
   ['T2','Ana Paula Ribeiro','Gerente regional','Macaé – Centro','Brigada de incêndio',95],
   ['T3','Rafael Souza','Alinhador','Macaé – Centro','NR-12 Elevador automotivo',12],
   ['T16','Eduardo Nunes','Operador de empilhadeira','Macaé – Centro','NR-11 Empilhadeira',150],
   ['T13','Renato Gomes','Alinhador','Macaé – Cavaleiros','NR-12 Elevador automotivo',410],
   ['T14','Patrícia Lopes','Vendedora','Macaé – Cavaleiros','Brigada de incêndio',60],
   ['T15','Bruno Teixeira','Montador','Macaé – Cavaleiros','NR-35 Trabalho em altura',25],
   ['T4','Jorge Lima','Operador de empilhadeira','Campos','NR-11 Empilhadeira',9],
   ['T11','Thiago Rocha','Motorista','Campos','Direção defensiva',180],
   ['T12','Juliana Freitas','Gerente de loja','Campos','Brigada de incêndio',40],
   ['T18','Rodrigo Pires','Montador','Campos','NR-35 Trabalho em altura',330],
   ['T5','Bruna Castro','Vendedora','Rio das Ostras','Brigada de incêndio',14],
   ['T6','Diego Martins','Montador','Rio das Ostras','Brigada de incêndio',14],
   ['T7','Lucas Pereira','Montador','Rio das Ostras','Brigada de incêndio',14],
   ['T8','Fernanda Alves','Gerente de loja','Rio das Ostras','NR-10 Básico',300],
   ['T9','Pedro Henrique Dias','Eletricista','Cabo Frio','NR-10 Básico',21],
   ['T10','Marcos Vinícius','Montador','Cabo Frio','NR-35 Trabalho em altura',-6],
   ['T17','Camila Duarte','Motorista','Cabo Frio','Direção defensiva',-2]
  ].map(([id,nome,funcao,loja,curso,o])=>({id,nome,funcao,loja,curso,venc:ad(o)})),
  ext:[
   ['EXT-0401','PQS 6 kg','ABC','Macaé – Centro','Recepção',120,900],
   ['EXT-0402','CO₂ 6 kg','BC','Macaé – Centro','Quadro elétrico',120,1400],
   ['EXT-0403','AP 10 L','A','Macaé – Centro','Estoque de pneus',28,600],
   ['EXT-0398','PQS 6 kg','ABC','Macaé – Cavaleiros','Escritório',362,1500],
   ['EXT-0405','PQS 6 kg','ABC','Macaé – Cavaleiros','Box 1',200,40],
   ['EXT-0406','PQS 6 kg','ABC','Macaé – Cavaleiros','Box 3',200,1100],
   ['EXT-0410','PQS 6 kg','ABC','Campos','Recepção',60,800],
   ['EXT-0411','CO₂ 6 kg','BC','Campos','Compressor',60,1000],
   ['EXT-0412','PQS 6 kg','ABC','Campos','Box 2',18,700],
   ['EXT-0413','AP 10 L','A','Campos','Estoque de pneus',18,500],
   ['EXT-0420','PQS 6 kg','ABC','Rio das Ostras','Recepção',250,1300],
   ['EXT-0421','CO₂ 6 kg','BC','Rio das Ostras','Quadro elétrico',-11,900],
   ['EXT-0430','PQS 6 kg','ABC','Cabo Frio','Box 1',330,20],
   ['EXT-0431','AP 10 L','A','Cabo Frio','Estoque de pneus',90,1200]
  ].map(([id,tipo,classe,loja,local,r,h])=>({id,tipo,classe,loja,local,rec:ad(r),hid:ad(h)})),
  forn:[
   {id:'F1',nome:'Fogocerto Extintores',contato:'Sérgio (comercial)',serv:[REC,HID],lojas:['Macaé – Centro','Macaé – Cavaleiros','Rio das Ostras','Cabo Frio'],prazo:'3 dias úteis',nota:'4,8'},
   {id:'F2',nome:'Planície Extintores',contato:'Márcia (atendimento)',serv:[REC,HID],lojas:['Campos'],prazo:'4 dias úteis',nota:'4,6'},
   {id:'F3',nome:'CT Maré Treinamentos',contato:'Roberta (agenda de turmas)',serv:['Brigada de incêndio','NR-35 Trabalho em altura','NR-10 Básico'],lojas:LOJAS,prazo:'turmas semanais',nota:'4,9'},
   {id:'F4',nome:'Operar Qualificação',contato:'Wagner (coordenação)',serv:['NR-11 Empilhadeira','NR-12 Elevador automotivo'],lojas:LOJAS,prazo:'turmas quinzenais',nota:'4,7'},
   {id:'F5',nome:'Rota Segura Cursos',contato:'Helena (secretaria)',serv:['Direção defensiva'],lojas:LOJAS,prazo:'turmas mensais',nota:'4,5'}
  ],
  ac:[]
 };
 s.ac=[
  {id:'AC-1047',kind:'ext',keys:['E:EXT-0412','E:EXT-0413'],servico:REC,loja:'Campos',forn:'F2',stage:0,valor:140,data:null,
   log:[[0,'Verificação automática: 2 extintores da loja Campos vencem em 18 dias.']]},
  {id:'AC-1046',kind:'trn',keys:['T:T5','T:T6','T:T7'],servico:'Brigada de incêndio',loja:'Rio das Ostras',forn:'F3',stage:2,valor:570,data:ad(9),
   log:[[-3,'Verificação automática: 3 colaboradores com a brigada vencendo.'],[-3,'Solicitação enviada a CT Maré Treinamentos por WhatsApp e e-mail.'],[-1,'CT Maré Treinamentos propôs turma em '+fd(ad(9))+' por '+brl(570)+'.'],[-1,'Valor acima do limite automático. Aguardando aprovação de Ana Paula Ribeiro.']]},
  {id:'AC-1045',kind:'trn',keys:['T:T9'],servico:'NR-10 Básico',loja:'Cabo Frio',forn:'F3',stage:1,valor:420,data:null,
   log:[[-2,'Verificação automática: reciclagem de NR-10 vence em 23 dias.'],[-2,'Solicitação enviada a CT Maré Treinamentos por WhatsApp e e-mail.']]},
  {id:'AC-1044',kind:'trn',keys:['T:T4'],servico:'NR-11 Empilhadeira',loja:'Campos',forn:'F4',stage:3,valor:350,data:ad(5),
   log:[[-8,'Verificação automática: reciclagem de NR-11 vence em 17 dias.'],[-8,'Solicitação enviada a Operar Qualificação.'],[-6,'Operar Qualificação propôs turma em '+fd(ad(5))+' por '+brl(350)+'.'],[-5,'Aprovado por Ana Paula Ribeiro.'],[-5,'Convocação enviada a Jorge Lima e ao gerente da loja Campos.']]},
  {id:'AC-1041',kind:'ext',keys:['E:EXT-0398'],servico:REC,loja:'Macaé – Cavaleiros',forn:'F1',stage:4,valor:78,data:ad(-3),auto:true,
   log:[[-12,'Verificação automática: 1 extintor vence em 9 dias.'],[-12,'Solicitação enviada a Fogocerto Extintores.'],[-11,'Fogocerto Extintores propôs '+fd(ad(-3))+' por '+brl(78)+'.'],[-11,'Aprovado automaticamente: valor dentro do limite.'],[-3,'Laudo lido pela IA. Validade renovada até '+fd(addM(ad(-3),12))+'.']]}
 ].map(a=>({auto:false,...a,log:a.log.map(([o,t])=>({d:ad(o),t}))}));
 return s;
}
S=seed();

/* ---------- modelo ---------- */
function items(){
 const a=S.trn.map(t=>({key:'T:'+t.id,kind:'trn',ref:t,titulo:t.nome,sub:t.funcao,loja:t.loja,servico:t.curso,venc:t.venc,preco:CURSOS[t.curso].p}));
 const b=S.ext.map(x=>{const h=x.hid<x.rec;return {key:'E:'+x.id,kind:'ext',ref:x,titulo:x.id,sub:x.tipo+' '+x.classe+' · '+x.local,loja:x.loja,servico:h?HID:REC,venc:h?x.hid:x.rec,preco:PRECO_EXT[x.tipo][h?'h':'r']}});
 return a.concat(b);
}
const byKey=k=>items().find(i=>i.key===k);
function st(d){const n=diff(d);
 if(n<0) return {k:'crit',txt:'Vencido há '+(-n)+(n===-1?' dia':' dias')};
 if(n<=S.janela) return {k:'warn',txt:n===0?'Vence hoje':'Vence em '+n+(n===1?' dia':' dias')};
 return {k:'ok',txt:'Em dia'};}
const openAc=k=>S.ac.find(a=>a.stage<4&&a.keys.includes(k));
const F=id=>S.forn.find(f=>f.id===id);
const STAGES=['Detectado','Solicitado','Aprovação','Agendado','Concluído'];
const STAGE_TXT=['Detectado','Aguardando fornecedor','Aguardando aprovação','Agendado','Concluído'];
const acItems=a=>a.keys.map(byKey);
const addLog=(a,t)=>a.log.push({d:new Date(T0),t});

/* ---------- ícones ---------- */
const IC={
 trn:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 5.5 8 2.5l6.5 3L8 8.5z"/><path d="M4 7v3.5c1.2 1.3 6.8 1.3 8 0V7"/></svg>',
 ext:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="6" height="9.5" rx="2"/><path d="M7 5V3h2v2M9 3h3.5M6.5 2.5 8 3"/></svg>'
};

/* ---------- navegação ---------- */
const VIEWS={painel:'Painel',acionamentos:'Acionamentos',treinamentos:'Treinamentos',extintores:'Extintores',fornecedores:'Fornecedores',regras:'Regras'};
function cur(){const h=location.hash.slice(1);return VIEWS[h]?h:'painel'}
function renderMenu(){
 const n=S.ac.filter(a=>a.stage<4).length, c=cur();
 document.getElementById('menu').innerHTML=Object.entries(VIEWS).map(([k,v])=>
  `<a href="#${k}" class="${k===c?'on':''}">${v}${k==='acionamentos'?`<span class="badge num">${n}</span>`:''}</a>`).join('');
}
function render(){renderMenu();const v=document.getElementById('view');v.innerHTML=R[cur()]();tourApply();}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- views ---------- */
const R={};
R.painel=()=>{
 const all=items(), crit=all.filter(i=>st(i.venc).k==='crit'), warn=all.filter(i=>st(i.venc).k==='warn');
 const conf=Math.round((all.length-crit.length)/all.length*100);
 const abertos=S.ac.filter(a=>a.stage<4).length;
 const sem=all.filter(i=>st(i.venc).k!=='ok'&&!openAc(i.key)).length;
 const att=all.filter(i=>st(i.venc).k!=='ok').sort((a,b)=>a.venc-b.venc);
 return `
 <div class="head"><div><h1>Painel de conformidade</h1><p>Treinamentos e extintores das 5 lojas. A verificação roda todo dia às 6h e aciona o fornecedor quando algo entra na janela de ${S.janela} dias.</p></div>
  <button class="btn pri" data-act="scan">Executar verificação agora</button></div>
 <div class="kpis">
  <div class="kpi ok"><span class="lbl">Em conformidade</span><span class="val">${conf}%</span><span class="hint">${all.length-crit.length} de ${all.length} itens válidos hoje</span></div>
  <div class="kpi crit"><span class="lbl">Vencidos</span><span class="val">${crit.length}</span><span class="hint">${crit.length?'precisam de ação imediata':'nenhum item vencido'}</span></div>
  <div class="kpi warn"><span class="lbl">Vencem em ${S.janela} dias</span><span class="val">${warn.length}</span><span class="hint">dentro da janela de acionamento</span></div>
  <div class="kpi"><span class="lbl">Acionamentos abertos</span><span class="val">${abertos}</span><span class="hint">${sem?sem+' item(ns) ainda sem acionamento':'todos os itens em risco já acionados'}</span></div>
 </div>
 <div class="grid2">
  <section class="panel"><header><h2>Precisa de atenção</h2><a href="#acionamentos" class="muted" style="font-size:.84rem">Ver acionamentos</a></header>
   <div class="body">${att.length?att.map(i=>{const s=st(i.venc),a=openAc(i.key);return `
    <div class="row"><span class="kind">${IC[i.kind]}</span>
     <div style="min-width:0"><div class="t">${esc(i.titulo)} <span class="muted" style="font-weight:400">· ${esc(i.servico)}</span></div>
     <div class="s">${esc(i.loja)} · ${a?`<span class="mono">${a.id}</span> ${STAGE_TXT[a.stage].toLowerCase()}`:'sem acionamento ainda'}</div></div>
     <span class="pill ${s.k}">${s.txt}</span></div>`}).join(''):'<div class="empty">Nada vencendo na janela. Tudo em dia.</div>'}</div></section>
  <section class="panel"><header><h2>Por loja</h2></header><div class="body">
   ${LOJAS.map(l=>{const li=all.filter(i=>i.loja===l),c=li.filter(i=>st(i.venc).k==='crit').length,w=li.filter(i=>st(i.venc).k==='warn').length,o=li.length-c-w,p=x=>x/li.length*100;
    return `<div class="loja"><div class="top"><strong>${l}</strong><span class="muted num">${li.length} itens${c?` · <span class="d-crit">${c} vencido${c>1?'s':''}</span>`:''}</span></div>
    <div class="bar" role="img" aria-label="${o} em dia, ${w} na janela, ${c} vencidos"><i class="b-ok" style="width:${p(o)}%"></i><i class="b-warn" style="width:${p(w)}%"></i><i class="b-crit" style="width:${p(c)}%"></i></div></div>`}).join('')}
   <div class="legend"><span><i style="background:var(--ok)"></i>Em dia</span><span><i style="background:var(--warn)"></i>Na janela</span><span><i style="background:var(--crit)"></i>Vencido</span></div>
  </div></section>
 </div>`;
};

R.acionamentos=()=>{
 const ab=S.ac.filter(a=>a.stage<4),cl=S.ac.filter(a=>a.stage===4),list=(S.tab==='abertos'?ab:cl).slice().sort((a,b)=>b.id.localeCompare(a.id));
 return `
 <div class="head"><div><h1>Acionamentos</h1><p>Cada acionamento junta os itens de uma loja que precisam do mesmo serviço e segue cinco passos até a validade ser renovada.</p></div>
  <button class="btn" data-act="scan">Executar verificação agora</button></div>
 <div class="flow">
  <div><b>1</b><strong>Detecta</strong><span>Item entra na janela de ${S.janela} dias</span></div>
  <div><b>2</b><strong>Aciona o fornecedor</strong><span>${S.canal}, com link de resposta</span></div>
  <div><b>3</b><strong>Aprova</strong><span>Automático até ${brl(S.limite)}; acima disso, o gestor aprova</span></div>
  <div><b>4</b><strong>Agenda</strong><span>Avisa a loja e os colaboradores</span></div>
  <div><b>5</b><strong>Renova</strong><span>A IA lê o certificado ou laudo e atualiza a validade</span></div>
 </div>
 <div class="tabs" role="tablist"><button class="${S.tab==='abertos'?'on':''}" data-act="tab" data-id="abertos">Em andamento (${ab.length})</button><button class="${S.tab==='fechados'?'on':''}" data-act="tab" data-id="fechados">Concluídos (${cl.length})</button></div>
 <div class="aclist">${list.length?list.map(card).join(''):'<div class="empty panel">Nenhum acionamento aqui.</div>'}</div>`;
};
function card(a){
 const its=acItems(a),f=F(a.forn),n=its.length;
 const what=a.kind==='ext'?`${n} extintor${n>1?'es':''}`:`${n} colaborador${n>1?'es':''}`;
 const minV=new Date(Math.min(...its.map(i=>i.venc)));
 const act=[
  `<button class="btn pri" data-act="enviar" data-id="${a.id}">Enviar solicitação ao fornecedor</button>`,
  `<button class="btn pri" data-act="forn" data-id="${a.id}">Ver resposta do fornecedor</button>`,
  `<button class="btn pri" data-act="aprovar" data-id="${a.id}">Revisar e aprovar</button>`,
  `<button class="btn pri" data-act="cert" data-id="${a.id}">Receber certificado</button>`,
  `<span class="pill ok">Renovado até ${fd(a.kind==='ext'?addM(a.data,PER_EXT[a.servico]):addM(a.data,CURSOS[a.servico].m))}</span>`][a.stage];
 return `<article class="ac ${S.fresh.has(a.id)?'fresh':''}" data-ac="${a.id}">
  <div class="top"><div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono muted">${a.id}</span><span class="pill plain ${a.kind==='ext'?'none':'info'}">${a.kind==='ext'?'Extintores':'Treinamento'}</span>${a.stage<4?`<span class="pill ${st(minV).k}">${st(minV).txt}</span>`:''}</div>
   <h3 style="margin-top:6px">${esc(a.servico)} · ${what}</h3>
   <div class="meta"><span>${esc(a.loja)}</span><span>${esc(f.nome)}</span>${a.data?`<span>Data: ${fd(a.data)}</span>`:''}</div></div>
   <div class="money"><b>${brl(a.valor)}</b><small>${a.stage<2?'estimado':a.auto?'aprovado automaticamente':a.stage>=3?'aprovado':'proposta'}</small></div></div>
  <ol class="steps">${STAGES.map((s,i)=>`<li class="${i<a.stage||a.stage===4?'done':''} ${i===a.stage?'cur':''}">${i===2&&a.auto&&a.stage>2?'Aprov. auto':s}</li>`).join('')}</ol>
  <div class="itens">${its.map(i=>`<span>${esc(i.titulo)}${a.kind==='ext'?' · '+esc(i.ref.tipo):''}</span>`).join('')}</div>
  <div class="foot">${act}<details class="log"><summary>Histórico (${a.log.length})</summary><ol>${a.log.map(l=>`<li><time>${fd(l.d)}</time><span>${esc(l.t)}</span></li>`).join('')}</ol></details></div>
 </article>`;
}

function filters(){
 return `<div class="filters"><select id="fl" data-filter="fl" aria-label="Loja"><option value="todas">Todas as lojas</option>${LOJAS.map(l=>`<option ${S.fl===l?'selected':''}>${l}</option>`).join('')}</select>
 <div class="chips">${[['todos','Todos'],['crit','Vencidos'],['warn','Na janela'],['ok','Em dia']].map(([k,v])=>`<button class="chip ${S.fs===k?'on':''}" data-act="fs" data-id="${k}">${v}</button>`).join('')}</div></div>`;
}
const pass=(loja,d)=>(S.fl==='todas'||S.fl===loja)&&(S.fs==='todos'||st(d).k===S.fs);

const A=id=>S.ac.find(a=>a.id===id);

function msgText(a){

 const lines=its.map(i=>'• '+(a.kind==='ext'?`${i.titulo} – ${i.ref.tipo} (${i.ref.local})`:`${i.titulo} – ${i.sub}`)).join('\n');
 return `Olá, ${first(f.contato)}! Aqui é o Renova, sistema de conformidade da Rodafort Pneus.\n\nPrecisamos de ${a.kind==='ext'?a.servico.toLowerCase():'turma de '+a.servico}${a.kind==='ext'?` para ${its.length} extintor${its.length>1?'es':''}`:` para ${its.length} colaborador${its.length>1?'es':''}`} na loja ${a.loja}:\n${lines}\n\nPrazo: até ${fd(minV)}.\nInforme data e valor por este link:\nrenova.app/s/${a.id.toLowerCase()}`;

const pickAc=()=>{const l=S.ac.filter(a=>a.stage===0).sort((a,b)=>b.id.localeCompare(a.id));return l.length?l[0].id:null};
const val=v=>typeof v==='function'?v():v;
const STEPS=[
 {id:'painel',view:'painel',title:'O painel do gestor',
  text:()=>`Aqui o gestor enxerga a rede inteira: quanto está em dia, o que já venceu e o que vence nos próximos ${S.janela} dias, loja por loja.`,

 {id:'scan',view:'painel',title:'A verificação diária',

  target:()=>q('.head [data-act="scan"]'),wait:'scan'},
 {id:'enviar',view:'acionamentos',title:'O pedido ao fornecedor',enter:()=>{T.ac=pickAc()},
  text:()=>`${T.scan?`A verificação abriu ${T.scan} acionamento${T.scan>1?'s':''}, um por loja e serviço, cada um já com o fornecedor que atende aquela loja. `:''}Vamos acompanhar o <b class="nw">${T.ac||'primeiro da lista'}</b> até o fim. Clique em <b>Enviar solicitação ao fornecedor</b>.`,
  target:()=>acBtn(T.ac,'enviar'),wait:'enviarOk'},
 {id:'forn',view:'acionamentos',title:'A resposta do fornecedor',
  text:()=>'O fornecedor recebe o pedido no WhatsApp e responde por um link, sem login nem cadastro. Clique em <b>Ver resposta do fornecedor</b> para ver a tela dele e enviar a proposta.',
  target:()=>acBtn(T.ac,'forn'),wait:'propOk'},
 {id:'aprov',view:'acionamentos',
  title:()=>manualNow()?'Aprovação do gestor':'Aprovação automática',
  text:()=>manualNow()
   ?`A proposta passou do limite de ${brl(S.limite)}, então o pedido espera o gestor. Clique em <b>Revisar e aprovar</b>.`
   :`A proposta ficou dentro do limite de ${brl(S.limite)}. O Renova aprovou sozinho, agendou o serviço e avisou a loja. Abra o <b>Histórico</b> do cartão para ver cada etapa registrada.`,
  target:()=>manualNow()?acBtn(T.ac,'aprovar'):acCard(T.ac),

 {id:'cert',view:'acionamentos',title:'Certificado lido pela IA',
  text:()=>'Depois do serviço, o fornecedor envia o laudo ou o certificado em PDF. A IA lê o documento, confere com o pedido e atualiza a validade. Clique em <b>Receber certificado</b>.',
  target:()=>acBtn(T.ac,'cert'),wait:'renOk'},
 {id:'gestor',view:'acionamentos',skip:()=>{const a=A('AC-1046');return T.manual||!a||a.stage!==2},
  title:'Acima do limite, o gestor decide',
  text:()=>`A turma de brigada de Rio das Ostras custa ${brl(A('AC-1046').valor)}, acima do limite automático, e por isso espera a aprovação do gestor. Clique em <b>Revisar e aprovar</b>.`,
  target:()=>acBtn('AC-1046','aprovar'),wait:'aprOk'},
 {id:'regras',view:'regras',title:'As regras são da empresa',
  text:()=>'Cada empresa define quantos dias antes o Renova age, até que valor ele aprova sozinho, por qual canal fala com o fornecedor e quem aprova o restante.',
  target:()=>q('#frm'),next:true},
 {id:'fim',view:'painel',title:'Fim do tour',
  text:()=>'O item renovado já saiu da lista de atenção. No dia a dia, o gestor acompanha a rede por este painel e só aprova o que passa do limite. Continue explorando ou recomece a demonstração do zero.',
  target:()=>q('.grid2 > .panel'),done:true}
];
function tourEnter(){
 while(T.i<STEPS.length&&STEPS[T.i].skip&&STEPS[T.i].skip()){T.skipped.add(T.i);T.i++}
 const s=STEPS[T.i];
 if(!s){T.on=false;tourApply();return}
 if(s.enter)s.enter();
 if(s.view==='acionamentos')S.tab='abertos';
 T.wait=val(s.wait)||null;T.next=!!val(s.next);T.title=val(s.title);T.text=s.text();T.last='';
 if(cur()!==s.view)location.hash=s.view;else render();
}
function tourAdvance(){T.i++;tourEnter()}
function tourHit(ev,id){
 if(!T.on)return false;
 let s=STEPS[T.i];
 if(ev==='scan'){T.scan=id;if(s.id==='painel'){T.i++;s=STEPS[T.i];T.wait='scan'}}
 if(ev==='recusar'){
  if(s.id==='aprov'&&id===T.ac){T.i=STEPS.findIndex(x=>x.id==='forn');tourEnter();return true}
  if(s.id==='gestor'){tourAdvance();return true}
  return false;
 }
 if(T.wait!==ev)return false;
 if(ev!=='scan'&&s.id!=='gestor'&&id)T.ac=id;
 if(s.id==='aprov'&&ev==='aprOk')T.manual=true;
 tourAdvance();return true;
}
function tourCount(){
 let n=0,N=0;
 STEPS.forEach((s,k)=>{const vis=k<=T.i?!T.skipped.has(k):!(s.skip&&s.skip());if(vis){N++;if(k<=T.i)n++}});
 return [n,N];
}
function tourApply(){
 document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
 const box=document.getElementById('tour');
 document.body.classList.toggle('touring',T.on);
 if(!T.on){box.innerHTML='';return}
 const s=STEPS[T.i],onView=cur()===s.view,tgt=onView&&s.target?s.target():null;
 if(tgt){
  tgt.classList.add('tour-hl');
  const key=T.i+'|'+(T.ac||'');
  if(T.last!==key){T.last=key;requestAnimationFrame(()=>{const el=q('.tour-hl');if(el)el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'})})}
 }
 const [n,N]=tourCount();
 let act;
 if(s.done)act='<button class="btn" data-act="reset">Recomeçar do zero</button><button class="btn pri" data-act="tourEnd">Concluir</button>';
 else if(!onView)act=`<button class="btn${T.next?'':' pri'}" data-act="tourGo">Ir para ${VIEWS[s.view]}</button>${T.next?'<button class="btn pri" data-act="tourNext">Próximo</button>':''}`;
 else if(T.next)act='<button class="btn pri" data-act="tourNext">Próximo</button>';
 else if(!tgt)act='<button class="btn" data-act="tourNext">Pular este passo</button>';
 else act='<span class="tc-wait">Clique no item destacado</span>';
 box.innerHTML=`<aside class="tourcard" aria-label="Tour guiado"><div class="tc-top"><span class="tc-step num">Passo ${n} de ${N}</span><button class="x" data-act="tourEnd" aria-label="Sair do tour">×</button></div><div class="tc-bar" aria-hidden="true"><i style="width:${Math.round(n/N*100)}%"></i></div><div aria-live="polite"><h3>${T.title}</h3><p>${T.text}</p></div><div class="tc-act">${act}</div></aside>`;
}

/* ---------- ações ---------- */
const ACT={
 bg:(id,el,e)=>{if(e.target===el)close()},
 close,
 explore:()=>close(),
 tab:id=>{S.tab=id;render()},
 fs:id=>{S.fs=id;render()},
 tourStart:()=>{close();S=seed();Object.assign(T,{on:true,i:0,ac:null,scan:0,manual:false,skipped:new Set()});tourEnter()},
 tourNext:()=>tourAdvance(),
 tourGo:()=>{const s=STEPS[T.i];if(cur()!==s.view)location.hash=s.view;else{T.last='';tourApply()}},
 tourEnd:()=>{const done=!!(STEPS[T.i]&&STEPS[T.i].done);T.on=false;tourApply();if(!done)toast('Tour encerrado. O botão Tour guiado recomeça do zero.')},
 reset:()=>{T.on=false;S=seed();close();if(cur()==='painel')render();else location.hash='painel';window.scrollTo(0,0);toast('Demonstração reiniciada do zero.')},
 scan:()=>{
  const groups={};
  items().filter(i=>st(i.venc).k!=='ok'&&!openAc(i.key)).forEach(i=>{const g=i.kind+'|'+i.servico+'|'+i.loja;(groups[g]=groups[g]||[]).push(i)});
  const novos=Object.values(groups).map(g=>{const i0=g[0],f=S.forn.find(f=>f.serv.includes(i0.servico)&&f.lojas.includes(i0.loja));
   const minV=new Date(Math.min(...g.map(i=>i.venc))),n=diff(minV);
   const a={id:'AC-'+(S.seq++),kind:i0.kind,keys:g.map(i=>i.key),servico:i0.servico,loja:i0.loja,forn:f.id,stage:0,valor:g.reduce((s,i)=>s+i.preco,0),data:null,auto:false,log:[]};
   addLog(a,`Verificação automática: ${g.length} ${i0.kind==='ext'?'extintor(es)':'colaborador(es)'} ${n<0?'com validade vencida':'vencendo em '+n+' dias'}.`);
   addLog(a,`Fornecedor escolhido: ${f.nome} (atende ${i0.loja}).`);
   S.fresh.add(a.id);return a});
  S.ac.push(...novos);
  toast(novos.length?`Verificação concluída: ${novos.length} acionamento${novos.length>1?'s':''} criado${novos.length>1?'s':''}.`:'Verificação concluída: nada novo para acionar.');
  if(novos.length)S.tab='abertos';
  if(tourHit('scan',novos.length))return;
  if(novos.length&&cur()!=='acionamentos'){location.hash='acionamentos';return}
  render();
 },
 enviar:id=>{const a=A(id),f=F(a.forn);
  modal('Solicitação ao fornecedor',`Mensagem que o sistema envia por ${S.canal.toLowerCase()}.`,
   `<div class="chat"><div class="to">Para: ${esc(f.nome)} · ${esc(f.contato)}</div><div class="bubble">${esc(msgText(a))}</div></div>`,
   `<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="enviarOk" data-id="${id}">Enviar agora</button>`,'enviar')},
 enviarOk:id=>{const a=A(id);a.stage=1;addLog(a,`Solicitação enviada a ${F(a.forn).nome} por ${S.canal.toLowerCase()}.`);close();render();toast('Solicitação enviada a '+F(a.forn).nome+'.');tourHit('enviarOk',id)},
 forn:id=>{const a=A(id),f=F(a.forn),its=acItems(a),sug=ad(a.kind==='ext'?4:8);
  modal('Visão do fornecedor','Simule a resposta que chega pelo link.',
   `<div class="phone"><div class="bar0"><span>renova.app/s/${a.id.toLowerCase()}</span><span>9:41</span></div><div class="ph">
    <div><strong>${esc(f.nome)}</strong><div class="muted" style="font-size:.8rem">Nova solicitação · Rodafort Pneus</div></div>
    <div class="card"><b>${esc(a.servico)}</b><br>${esc(a.loja)}<br>${its.map(i=>esc(i.titulo)).join(', ')}</div>
    <div class="field"><label for="pd">Data proposta</label><input id="pd" type="date" value="${iso(sug)}" min="${iso(T0)}"></div>
    <div class="field"><label for="pv">Valor total (R$)</label><input id="pv" type="number" min="0" step="1" value="${a.valor}"></div>
    <button class="btn pri" data-act="propOk" data-id="${id}" style="justify-content:center">Enviar proposta</button>
   </div></div><div class="caption">O fornecedor abre o link no celular. Não precisa de login nem de cadastro.</div>`,'','forn')},
 propOk:id=>{const a=A(id),f=F(a.forn),d=document.getElementById('pd').value,v=Number(document.getElementById('pv').value);
  if(!d||!(v>=0)){toast('Informe a data e o valor da proposta.');return}

  let msg;
  if(v<=S.limite){a.auto=true;a.stage=3;addLog(a,`Aprovado automaticamente: valor dentro do limite de ${brl(S.limite)}.`);addLog(a,aviso(a));msg='Proposta aprovada automaticamente e agendada.'}
  else{a.stage=2;addLog(a,`Valor acima do limite automático. Aguardando aprovação de ${S.aprovador}.`);msg='Proposta recebida. Aguardando aprovação.'}
  close();render();toast(msg);tourHit('propOk',id)},
 aprovar:id=>{const a=A(id),f=F(a.forn),its=acItems(a);
  modal('Aprovar acionamento',`${a.id} · aprovação de ${esc(S.aprovador)}`,
   `<dl class="sum"><dt>Serviço</dt><dd>${esc(a.servico)}</dd><dt>Loja</dt><dd>${esc(a.loja)}</dd><dt>Fornecedor</dt><dd>${esc(f.nome)}</dd><dt>Data</dt><dd>${fd(a.data)}</dd><dt>Valor</dt><dd>${brl(a.valor)}</dd><dt>Itens</dt><dd>${its.map(i=>esc(i.titulo)).join(', ')}</dd></dl>
   <p class="muted" style="margin:0;font-size:.84rem">Ao aprovar, o fornecedor recebe a confirmação e ${a.kind==='trn'?'os colaboradores recebem a convocação':'o gerente da loja recebe o aviso da visita'}.</p>`,
   `<button class="btn danger" data-act="recusar" data-id="${id}">Recusar e pedir nova proposta</button><button class="btn pri" data-act="aprOk" data-id="${id}">Aprovar</button>`,'aprovar')},
 aprOk:id=>{const a=A(id);a.stage=3;addLog(a,`Aprovado por ${S.aprovador}.`);addLog(a,aviso(a));close();render();toast('Aprovado e agendado para '+fd(a.data)+'.');tourHit('aprOk',id)},
 recusar:id=>{const a=A(id);a.stage=1;addLog(a,`Proposta recusada por ${S.aprovador}. Nova proposta solicitada.`);close();render();toast('Nova proposta solicitada ao fornecedor.');tourHit('recusar',id)},
 cert:id=>{const a=A(id),its=acItems(a),per=a.kind==='ext'?PER_EXT[a.servico]:CURSOS[a.servico].m,prox=addM(a.data,per);
  const nome=a.kind==='ext'?`Laudo_${a.servico.startsWith('Recarga')?'recarga':'hidrostatico'}_${slug(a.loja)}.pdf`:`Certificados_${slug(a.servico.split(' ')[0])}_${slug(a.loja)}.pdf`;
  const res=its.map((i,k)=>a.kind==='ext'
   ?`<li><b>${i.titulo} · ${i.ref.tipo}</b>${a.servico} em ${fd(a.data)} · selo de conformidade nº ${(48213+k*7).toString().padStart(7,'0')} · próxima até ${fd(prox)}</li>`
   :`<li><b>${esc(i.titulo)}</b>Concluiu ${esc(a.servico)} em ${fd(a.data)} · carga horária ${CURSOS[a.servico].ch} · válido até ${fd(prox)}</li>`).join('');
  modal('Certificado recebido',`${esc(F(a.forn).nome)} enviou o documento depois do serviço.`,
   `<div class="doc"><span class="ic">PDF</span><div><strong style="word-break:break-all">${nome}</strong><div class="muted" style="font-size:.8rem">${its.length} ${a.kind==='ext'?'laudo(s)':'certificado(s)'} · recebido hoje</div></div></div>
   <div class="ia" id="ia"><h3>Leitura por IA</h3><div><span class="spin"></span>Lendo o documento e conferindo com os itens do acionamento…</div></div>`,
   `<button class="btn" data-act="close">Fechar</button><button class="btn pri" id="renBtn" data-act="renOk" data-id="${id}" disabled>Confirmar e renovar</button>`,'cert');
  setTimeout(()=>{const box=document.getElementById('ia');if(!box)return;box.innerHTML=`<h3>Leitura por IA</h3><ul>${res}</ul><p style="margin:10px 0 0;font-size:.82rem">Todos os itens conferem com o acionamento ${a.id}.</p>`;const b=document.getElementById('renBtn');if(b){b.disabled=false;b.focus()}},1500)},
 renOk:id=>{const a=A(id),per=a.kind==='ext'?PER_EXT[a.servico]:CURSOS[a.servico].m,prox=addM(a.data,per);
  acItems(a).forEach(i=>{if(i.kind==='trn')i.ref.venc=prox;else{if(a.servico===HID)i.ref.hid=prox;i.ref.rec=a.servico===HID?addM(a.data,12):prox}});
  a.stage=4;addLog(a,`${a.kind==='ext'?'Laudo':'Certificado'} lido pela IA. Validade renovada até ${fd(prox)}.`);S.fresh.delete(id);close();render();toast(`Renovado até ${fd(prox)}. O painel já foi atualizado.`);tourHit('renOk',id)}
};
function aviso(a){const its=acItems(a);
 return a.kind==='trn'?`Convocação enviada a ${its.map(i=>first(i.titulo)).join(', ')} e ao gerente da loja ${a.loja}.`:`Aviso de visita enviado ao gerente da loja ${a.loja} para ${fd(a.data)}.`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;if(b.tagName==='A')e.preventDefault();f(b.dataset.id,b,e)});
document.addEventListener('change',e=>{if(e.target.dataset.filter==='fl'){S.fl=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='frm')return;e.preventDefault();
 S.janela=Number(document.getElementById('rj').value);S.limite=Math.max(0,Number(document.getElementById('rl').value)||0);
 S.canal=document.getElementById('rc').value;S.aprovador=document.getElementById('ra').value.trim()||S.aprovador;
 render();toast('Regras salvas. A próxima verificação já usa a janela de '+S.janela+' dias.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
welcome();
</script>
</body>
</html>
